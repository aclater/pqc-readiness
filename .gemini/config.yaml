# Settings for the AI pull-request reviewer GitHub app (#235).  The
# project's review conventions are in styleguide.md next to this file.
have_fun: false
code_review:
  disable: false
  # Skip style nits; ruff and mypy --strict already gate those.
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns:
  # Captured from real hosts or generated; reviewed at capture time.
  - "tests/fixtures/**"
  - "tests/fixtures/golden/**"
  - "docs/examples/**"
  - ".secrets.baseline"
