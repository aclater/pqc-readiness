# SPDX-License-Identifier: Apache-2.0
# CI: build the UBI 10 and Debian runtime images, smoke-test --help on
# each, then run the full pytest suite inside a test extension image
# layered on each one.  Companion to ci-ubi8.yml, which does the same for
# the UBI 8 image under python3.9.
#
# Why a separate workflow per base image: each `podman build` is the
# slow step (a base-image pull + microdnf/apt-get layers) and the three
# images are independent — running them as parallel jobs keeps total
# wall-clock close to the slowest single build instead of the sum.
#
# Why --help *and* pytest: --help is the cheapest round-trip through
# ENTRYPOINT + the wrapper and proves the image starts, so a broken
# build fails fast with an unambiguous message.  The pytest step then
# runs the whole suite under each image's own interpreter and OpenSSL
# (UBI 10: the RHEL 10 python3 + OpenSSL 3.5; Debian 12: python 3.11 +
# OpenSSL 3.0), which ci.yml's setup-python matrix on ubuntu-latest
# cannot reproduce (#84).  The test image is CI-only: pytest and the
# fixtures are never shipped in the runtime image.
#
# Action versions verified against upstream releases at the time of
# writing (per CLAUDE.md "Always verify current versions before using
# them").  Bump deliberately and re-verify, not via Dependabot churn:
#   actions/checkout@v6.0.2  (gh api repos/actions/checkout/releases/latest)

name: ci-containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ubi10:
    name: build + test (UBI 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build the zipapp the image ships
        # Every Containerfile COPYs dist/pqc-readiness.pyz (#80).
        run: python3 scripts/build_zipapp.py

      - name: Build the UBI 10 runtime image
        # podman is preinstalled on ubuntu-latest runners; the same
        # `make container-ubi10` target reproduces this locally.
        run: |
          podman build --format=docker \
            -t pqc-readiness:ubi10 \
            -f Containerfile.ubi10 .

      - name: Smoke-test the wrapper launcher
        # --help overrides the image's CMD (--json) and exits 0 on
        # success.  If the base-image bump dropped python3 or the
        # wrapper cannot find it, this step fails before any downstream
        # consumer pulls the image.
        run: |
          podman run --rm pqc-readiness:ubi10 --help >/dev/null

      - name: Build the UBI 10 test extension image
        # Same pattern as ci-ubi8.yml: layer pytest + schema validators on
        # the runtime image and COPY tests/, the package and the zipapp into a work dir.
        run: |
          cat <<'CONTAINERFILE' | podman build --format=docker -t pqc-readiness:ubi10-test -f - .
          FROM pqc-readiness:ubi10
          USER 0
          WORKDIR /tmp/build
          RUN microdnf install -y --nodocs --setopt=install_weak_deps=0 \
                  python3-pip \
                  git \
              && microdnf clean all
          RUN python3 -m pip install --no-cache-dir \
                  pytest \
                  jsonschema \
                  referencing
          COPY tests/                   /tmp/build/tests/
          COPY pqc_readiness/           /tmp/build/pqc_readiness/
          COPY pqc-readiness            /tmp/build/pqc-readiness
          COPY dist/pqc-readiness.pyz   /tmp/build/dist/pqc-readiness.pyz
          RUN chmod 0755 /tmp/build/pqc-readiness /tmp/build/dist/pqc-readiness.pyz
          CONTAINERFILE

      - name: Run pytest inside the UBI 10 test image
        run: |
          podman run --rm \
            --user 0 \
            --entrypoint /bin/sh \
            pqc-readiness:ubi10-test \
            -c 'cd /tmp/build && python3 -m pytest tests/ -q && PQC_READINESS_PYZ=dist/pqc-readiness.pyz python3 -m pytest tests/ -q'

  build-debian:
    name: build + test (Debian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build the zipapp the image ships
        # Every Containerfile COPYs dist/pqc-readiness.pyz (#80).
        run: python3 scripts/build_zipapp.py

      - name: Build the Debian runtime image
        run: |
          podman build --format=docker \
            -t pqc-readiness:debian \
            -f Containerfile.debian .

      - name: Smoke-test the wrapper launcher
        run: |
          podman run --rm pqc-readiness:debian --help >/dev/null

      - name: Build the Debian test extension image
        # Debian 12's python3 is "externally managed" (PEP 668), so the
        # test deps come from apt rather than pip.
        run: |
          cat <<'CONTAINERFILE' | podman build --format=docker -t pqc-readiness:debian-test -f - .
          FROM pqc-readiness:debian
          USER 0
          WORKDIR /tmp/build
          RUN apt-get update \
              && apt-get install -y --no-install-recommends \
                  python3-pytest \
                  python3-jsonschema \
                  git \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*
          COPY tests/                   /tmp/build/tests/
          COPY pqc_readiness/           /tmp/build/pqc_readiness/
          COPY pqc-readiness            /tmp/build/pqc-readiness
          COPY dist/pqc-readiness.pyz   /tmp/build/dist/pqc-readiness.pyz
          RUN chmod 0755 /tmp/build/pqc-readiness /tmp/build/dist/pqc-readiness.pyz
          CONTAINERFILE

      - name: Run pytest inside the Debian test image
        run: |
          podman run --rm \
            --user 0 \
            --entrypoint /bin/sh \
            pqc-readiness:debian-test \
            -c 'cd /tmp/build && python3 -m pytest tests/ -q && PQC_READINESS_PYZ=dist/pqc-readiness.pyz python3 -m pytest tests/ -q'
