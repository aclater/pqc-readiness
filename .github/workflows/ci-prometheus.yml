# SPDX-License-Identifier: Apache-2.0
# Lints --prometheus output with the real promtool (#140).  A separate
# workflow file so it can't collide with other lanes' ci.yml edits (#137).
name: ci-prometheus

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  promtool:
    name: promtool check metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Render metrics on the runner
        # Exit codes 0-3 are the readiness verdict (the runner is usually
        # "Marginal"), not errors; 4 and 5 (gate failure, unwritable
        # --output) or anything else fail the step.
        run: |
          set +e
          python -m pqc_readiness --prometheus --scan-trust-store --scan-packages --output metrics.prom
          rc=$?
          if [ "$rc" -gt 3 ]; then echo "pqc-readiness exited $rc"; exit 1; fi
          test -s metrics.prom

      - name: promtool check metrics
        # Pinned image tag (verified as the current Prometheus release).
        run: docker run --rm -i --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0 check metrics < metrics.prom
