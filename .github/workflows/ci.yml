# SPDX-License-Identifier: Apache-2.0
# CI: lint, typecheck, tests.  Container build is a separate workflow
# so a failing image build does not block PR review on the Python diff.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy numpy

      - name: ruff check
        run: ruff check pqc_readiness.py tests/

      - name: mypy --strict
        run: mypy --strict pqc_readiness.py

      - name: pytest
        run: pytest tests/ -q
