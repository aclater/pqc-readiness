# SPDX-License-Identifier: Apache-2.0
# CI: lint, typecheck, tests.  Container build is a separate workflow
# so a failing image build does not block PR review on the Python diff.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
          # No cache: actions/setup-python's pip-cache key requires a
          # requirements.txt or pyproject.toml; we ship neither today
          # because the runtime has no deps beyond stdlib + optional
          # numpy.  Re-enable when we add packaging metadata.

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # jsonschema + referencing are dev-only; the runtime stays
          # stdlib + optional numpy.  jsonschema is needed by the CBOM
          # tests to validate against the bundled CycloneDX 1.6 schema.
          # ruff and mypy are pinned: an unpinned upgrade changed ruff's
          # default rule set and broke lint on unchanged code (#97).
          pip install pytest ruff==0.17.0 mypy==2.4.0 numpy jsonschema referencing

      - name: ruff check
        run: ruff check pqc_readiness/ scripts/ tests/

      - name: mypy --strict
        run: mypy --strict pqc_readiness

      - name: pytest (source package)
        run: pytest tests/ -q

      - name: Build the zipapp
        run: python scripts/build_zipapp.py

      - name: pytest (built zipapp)
        # The whole suite again, importing pqc_readiness from inside
        # dist/pqc-readiness.pyz, so the shipped artifact is what is tested (#80).
        run: PQC_READINESS_PYZ=dist/pqc-readiness.pyz pytest tests/ -q

      - name: Smoke-test the zipapp as an executable
        run: |
          ./dist/pqc-readiness.pyz --version
          ./dist/pqc-readiness.pyz --json > /tmp/report.json || test $? -le 3
          python -c "import json; json.load(open('/tmp/report.json'))"

      - name: README documents every --help flag
        run: bash scripts/check-readme-flags.sh

  detect-secrets:
    # Parity with the detect-secrets pre-commit hook (#94).  pre-commit is
    # opt-in per clone and is bypassed entirely by GitHub web-UI edits, so
    # CI is the only place this check is guaranteed to run.  Uses the same
    # .secrets.baseline and the same detect-secrets version as
    # .pre-commit-config.yaml; a finding not in the baseline exits
    # nonzero and fails the PR.
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan tracked files against .secrets.baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
