# Opt-in overlay: base DaemonSet + per-node summary ConfigMaps (#157).
#   oc apply -k deploy/openshift-summary
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../openshift
  - rbac.yaml
patches:
  - path: daemonset-patch.yaml
configMapGenerator:
  - name: pqc-readiness-summary-script
    namespace: pqc-readiness
    files:
      - publish-node-summary.py
    options:
      labels:
        app.kubernetes.io/name: pqc-readiness
