# SPDX-License-Identifier: Apache-2.0
# OpenShift DaemonSet manifest for pqc-readiness fleet inventory.
#
# Strategy: a CronJob would be more natural for a recurring probe than a
# DaemonSet, but per the v2 spec we ship a DaemonSet so each node has a
# long-lived inventory pod that re-runs the probe on a schedule via an
# in-pod sleep loop.  This keeps the SCC + ServiceAccount + RBAC
# footprint static rather than churning per probe cycle.
#
# Apply (creates the namespace, ServiceAccount, SCC and DaemonSet):
#   oc apply -k deploy/openshift
#
# The pod runs as non-root UID 1001 with no capabilities, seccomp
# RuntimeDefault, no_new_privs and a read-only root filesystem.  It mounts
# the host's /proc /sys /dev /etc /usr and rpm database read-only;
# --host-mount /host redirects the probe's reads there.
#
# hostPID: CRI-O runs containers that share the host PID namespace with
# the SELinux type spc_t instead of container_t.  The probe needs that:
# under container_t, SELinux denies reads of host files such as
# /etc/ssl/certs (verified on OpenShift 4.22, #220).  The pod is therefore
# not SELinux-confined; the controls above are what bound it.
#
# Reports go to an emptyDir (kept for the pod's lifetime, pruned after
# PQC_RETENTION_DAYS).  A hostPath output volume can't work: kubelet
# creates it root:root 0755 and UID 1001 can't write to it.  Collect
# reports with `oc cp`, the summary overlay (deploy/openshift-summary), or
# swap the volume for an RWX PVC.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pqc-readiness
  namespace: pqc-readiness
  labels:
    app.kubernetes.io/name: pqc-readiness
    app.kubernetes.io/component: probe
---
# Custom SCC: based on hostmount-anyuid (which permits hostPath) but
# narrowed — no privilege escalation, drop ALL capabilities, run as
# specific non-root UID, no host network.  hostPID is required so the
# probe sees the real /proc/1/cgroup of the node, not the pod's.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: pqc-readiness-scc
  annotations:
    kubernetes.io/description: >-
      Read-only host inspection: hostPID + hostPath ro mounts of /proc
      /sys /dev /etc /usr /var/lib/rpm.  Non-root, no capabilities, no
      host network.
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: false
allowHostPID: true
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
# The pod requests seccomp RuntimeDefault; an SCC without seccompProfiles
# forbids every profile, so admission would reject the pod (#220).
seccompProfiles:
  - runtime/default
fsGroup:
  type: MustRunAs
  ranges:
    - min: 0
      max: 0
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - hostPath
  - projected
  - secret
users:
  - system:serviceaccount:pqc-readiness:pqc-readiness
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pqc-readiness
  namespace: pqc-readiness
  labels:
    app.kubernetes.io/name: pqc-readiness
    app.kubernetes.io/component: probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pqc-readiness
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pqc-readiness
        app.kubernetes.io/component: probe
    spec:
      serviceAccountName: pqc-readiness
      hostPID: true
      automountServiceAccountToken: false
      tolerations:
        # Probe every node, including control plane and tainted workers.
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          # Published release image built from Containerfile.ubi10 (tags
          # 2.2.0-ubi8 / 2.2.0-debian for the other bases), signed with
          # cosign.  Pin by digest in production: the release's
          # container-images.txt asset lists every digest.
          image: ghcr.io/aclater/pqc-readiness:2.2.0
          imagePullPolicy: IfNotPresent
          # Re-runs the probe every PQC_PROBE_INTERVAL seconds; default
          # 1 hour.  Each iteration writes a timestamped JSON to the
          # output volume.  Operators aggregate across the fleet by
          # collecting these files and feeding them to
          # `pqc-readiness --aggregate <dir>`.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              interval="${PQC_PROBE_INTERVAL:-3600}"
              while true; do
                /usr/local/bin/pqc-readiness \
                  --host-mount /host \
                  --bench --seconds 1 \
                  --save --quiet \
                  || true
                # Optional Prometheus metrics for node_exporter's textfile
                # collector (#140): set PQC_PROM_FILE (see env below) to a
                # *.prom path inside a volume node_exporter also reads.
                # Skips --bench: the metrics don't use benchmark results.
                if [ -n "${PQC_PROM_FILE:-}" ]; then
                  /usr/local/bin/pqc-readiness \
                    --host-mount /host \
                    --prometheus --output "$PQC_PROM_FILE" \
                    || true
                fi
                # Opt-in per-node summary ConfigMap (deploy/openshift-summary,
                # #157).  Unset in the base: no API access, nothing runs.
                if [ -n "${PQC_SUMMARY_HOOK:-}" ]; then
                  "$PQC_SUMMARY_HOOK" || true
                fi
                # Keep the emptyDir bounded: drop reports older than
                # PQC_RETENTION_DAYS.
                find "$HOME/.cache/pqc-readiness" -name '*.json' \
                  -mtime "+${PQC_RETENTION_DAYS:-7}" -delete 2>/dev/null || true
                sleep "$interval"
              done
          env:
            - name: PQC_PROBE_INTERVAL
              value: "3600"
            - name: PQC_RETENTION_DAYS
              value: "7"
            # Uncomment (and mount node-exporter-textfile below) to export
            # metrics; the path must end in .prom (#140).
            # - name: PQC_PROM_FILE
            #   value: /textfile/pqc_readiness.prom
            - name: HOME
              value: /var/lib/pqc-readiness
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            # Host /usr, read-only (#187).  One mount covers every host path
            # the probe reads under /usr: /usr/lib/os-release (detect_os;
            # /etc/os-release symlinks to it on most distros), the
            # crypto-policies back-ends in /usr/share/crypto-policies that
            # /etc/crypto-policies/back-ends/*.config symlink into (#104),
            # and SUSE's vendor sshd config in /usr/etc/ssh (#105).
            # /usr/etc/ssh can't be mounted on its own: it is absent on
            # RHEL-family nodes, kubelet's type: Directory would then keep
            # the pod from starting, and CRI-O creates missing hostPath
            # sources (MkdirAll) when no type is set, which would write to
            # the host.  /usr exists on every node.  The probe only reads
            # the /usr paths listed in _platform._HOST_NAMESPACES; /usr is
            # world-readable OS content, mounted read-only.
            - name: host-usr
              mountPath: /host/usr
              readOnly: true
            # Host rpm database for --scan-packages / NSS version (#125).
            # /var/lib/rpm is the real directory on EL8/EL9 and a relative
            # symlink to /usr/lib/sysimage/rpm on EL10/Fedora/SUSE; the
            # bind mount follows it, so one mount covers every layout.
            - name: host-rpmdb
              mountPath: /host/var/lib/rpm
              readOnly: true
            - name: readiness-output
              mountPath: /var/lib/pqc-readiness
              readOnly: false
            # - name: node-exporter-textfile
            #   mountPath: /textfile
            #   readOnly: false
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
        # Every Linux node has /usr (see the host-usr mount comment).
        - name: host-usr
          hostPath:
            path: /usr
            type: Directory
        - name: host-rpmdb
          hostPath:
            path: /var/lib/rpm
            type: Directory
        # Output: an emptyDir (see the header).  For central collection,
        # replace it with a PVC on RWX storage (e.g. NFS, CephFS); report
        # file names include the node's hostname, so nodes don't collide.
        - name: readiness-output
          emptyDir:
            sizeLimit: 256Mi
        # Directory node_exporter reads with --collector.textfile.directory
        # (match your node_exporter deployment; #140).
        # - name: node-exporter-textfile
        #   hostPath:
        #     path: /var/lib/node_exporter/textfile_collector
        #     type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
