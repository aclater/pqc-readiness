# Libreswan ipsec.conf, syntax per the Libreswan 5.4 algorithm parser:
# ";" separates the key exchange, ke= / addkeN= / "+" alternatives.
config setup
	logfile=/var/log/pluto.log

conn %default
	ikev2=insist

conn hybrid
	intermediate=yes
	ike=aes128-sha2-dh31;addke1=ml_kem_1024
	esp=aes_gcm256-null

conn pure
	ike=aes;ke=ml_kem_768

include /etc/ipsec.d/*.conf
