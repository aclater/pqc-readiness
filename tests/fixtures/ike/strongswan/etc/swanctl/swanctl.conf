# strongSwan 6 swanctl.conf, syntax per swanctl.opt (keX_ = RFC 9370
# additional key exchange, keX_none = optional).
connections {
    hybrid-mandatory {
        version = 2
        proposals = aes256gcm16-prfsha384-x25519-ke1_mlkem768
        children {
            net {
                esp_proposals = aes256gcm16-x25519-ke1_mlkem768
            }
        }
    }
    hybrid-optional {
        proposals = aes256-sha384-ecp384-ke1_mlkem1024-ke1_none, aes256-sha384-ecp384
    }
    classical-only {
        proposals = aes256-sha256-modp3072  # no PQC
        children {
            net {
                esp_proposals = aes128gcm16
            }
        }
    }
    defaults {
        proposals = default
    }
}
include conf.d/*.conf
