Listen 9443 https
Listen 9444 https
<VirtualHost *:9443>
 SSLEngine on
 SSLCertificateFile /etc/pqct/cert.pem
 SSLCertificateKeyFile /etc/pqct/key.pem
</VirtualHost>
<VirtualHost *:9444>
 SSLEngine on
 SSLCertificateFile /etc/pqct/cert.pem
 SSLCertificateKeyFile /etc/pqct/key.pem
 SSLOpenSSLConfCmd Groups X25519:prime256v1
</VirtualHost>
