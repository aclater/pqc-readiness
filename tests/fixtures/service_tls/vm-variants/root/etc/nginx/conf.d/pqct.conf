server { listen 8443 ssl; ssl_certificate /etc/pqct/cert.pem; ssl_certificate_key /etc/pqct/key.pem; return 200; }
server { listen 8444 ssl; ssl_certificate /etc/pqct/cert.pem; ssl_certificate_key /etc/pqct/key.pem; ssl_ecdh_curve X25519:prime256v1; return 200; }
server { listen 8445 ssl; ssl_certificate /etc/pqct/cert.pem; ssl_certificate_key /etc/pqct/key.pem; ssl_ecdh_curve X25519MLKEM768:X25519; return 200; }
